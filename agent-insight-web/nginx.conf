server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 方案 A：Traefik 只转发到本前端；Nginx 再经 Docker 网络转发 API。
    # Traefik 已在外层处理 TLS，这些头会把原始请求信息传给 Spring Boot。
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    # 容器健康检查；精确匹配，避免被 SPA fallback 处理。
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # API：proxy_pass 不带 URI 后缀，保留 /api/ 前缀；后端路径为 /api/v1/...
    # 勿在 proxy_pass 末尾加 /，否则会剥掉 /api 前缀导致后端 404。
    location ^~ /api/ {
        proxy_pass http://agent-insight-backend:9280;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # Knife4j / OpenAPI：这些请求必须到后端，不能由 React 的 SPA fallback 返回。
    location = /doc.html {
        proxy_pass http://agent-insight-backend:9280;
    }

    location ^~ /v3/api-docs/ {
        proxy_pass http://agent-insight-backend:9280;
    }

    location ^~ /webjars/ {
        proxy_pass http://agent-insight-backend:9280;
    }

    location ^~ /swagger-ui/ {
        proxy_pass http://agent-insight-backend:9280;
    }

    # 静态资源长期缓存；文件名由 Vite content hash 区分版本。
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/json application/xml;

    # SPA：只用 $uri，不要 $uri/（补斜杠 301 在 Traefik 后易写成 http://）
    location / {
        try_files $uri /index.html;
    }
}
