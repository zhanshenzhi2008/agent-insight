server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 方案 A：Traefik 只转发到本前端；Nginx 再经 Docker db-net 转发 API。
    # Traefik 已在外层处理 TLS，这些头会把原始请求信息传给 Spring Boot。
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    # 容器健康检查；精确匹配，避免被 SPA fallback 处理。
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK";
    }

    # API：proxy_pass 不带 URI 后缀，保留 /api/ 前缀；后端路径为 /api/v1/...
    location ^~ /api/ {
        proxy_pass http://agent-insight-backend:9280;
    }

    # Knife4j / OpenAPI：这些请求必须到后端，不能由 React 的 SPA fallback 返回。
    location = /doc.html {
        proxy_pass http://agent-insight-backend:9280;
    }

    location ^~ /v3/api-docs/ {
        proxy_pass http://agent-insight-backend:9280;
    }

    location ^~ /webjars/ {
        proxy_pass http://agent-insight-backend:9280;
    }

    location ^~ /swagger-ui/ {
        proxy_pass http://agent-insight-backend:9280;
    }

    # 静态资源长期缓存；文件名由 Vite content hash 区分版本。
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React 前端路由：不存在的静态路径回退到入口页面。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
