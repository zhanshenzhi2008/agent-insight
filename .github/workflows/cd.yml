# =============================================================================
# Agent Insight - CD（对齐 ai-job-hunter + github-cicd-template skill）
#
# 硬规则：
#   - 服务器只 docker login → pull → up；不 SCP/rsync 覆盖 compose / .env
#   - 镜像双 tag：immutable(sha) + :latest；服务器始终拉 :latest
#   - 镜像名扁平（对齐 ai-job-hunter）：agent-insight-backend / agent-insight-frontend
#     勿用 agent-insight/backend（GHCR 嵌套包易 permission_denied: read_package）
#   - CI 通过后才部署（workflow_run）
#
# Secrets：DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY / DEPLOY_PATH
#          DEPLOY_SSH_PORT（可选）IMAGE_REGISTRY_TOKEN（可选，默认 GITHUB_TOKEN）
# =============================================================================

name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      service:
        description: "选择部署服务"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - backend
          - frontend
      image_tag:
        description: "留空=latest；回滚填历史 sha"
        required: false
        default: ""
        type: string

env:
  IMAGE_REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}
  # GHCR 包路径（slash）；compose image 必须一致
  IMAGE_BACKEND: agent-insight-backend
  IMAGE_FRONTEND: agent-insight-frontend
  COMPOSE_FILE: docker-compose.yml
  COMPOSE_BACKEND: agent-insight-backend
  COMPOSE_FRONTEND: agent-insight-frontend
  DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
  DEPLOY_PRIMARY_BRANCH: ${{ vars.DEPLOY_PRIMARY_BRANCH || 'main' }}

permissions:
  contents: read
  packages: write
  actions: write
  issues: write

jobs:
  prepare:
    name: Decide what to build
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      build_backend: ${{ steps.decide.outputs.build_backend }}
      build_frontend: ${{ steps.decide.outputs.build_frontend }}
      build_any: ${{ steps.decide.outputs.build_any }}
      head_sha: ${{ steps.decide.outputs.head_sha }}
      head_branch: ${{ steps.decide.outputs.head_branch }}
    steps:
      - name: Decide
        id: decide
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SHA="${{ github.sha }}"
            BRANCH="${{ github.ref_name }}"
            SVC="${{ inputs.service }}"
            BE=false; FE=false
            case "$SVC" in
              all) BE=true; FE=true ;;
              backend) BE=true ;;
              frontend) FE=true ;;
            esac
          else
            SHA="${{ github.event.workflow_run.head_sha }}"
            BRANCH="${{ github.event.workflow_run.head_branch }}"
            BE=true
            FE=true
          fi

          if [ "$BRANCH" != "${{ env.DEPLOY_PRIMARY_BRANCH }}" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Not primary branch ($BRANCH), skip"
            BE=false; FE=false
          fi

          ANY=false
          if [ "$BE" = "true" ] || [ "$FE" = "true" ]; then ANY=true; fi

          echo "build_backend=$BE" >> "$GITHUB_OUTPUT"
          echo "build_frontend=$FE" >> "$GITHUB_OUTPUT"
          echo "build_any=$ANY" >> "$GITHUB_OUTPUT"
          echo "head_sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "head_branch=$BRANCH" >> "$GITHUB_OUTPUT"

  build:
    name: Build & Push Images
    needs: prepare
    if: needs.prepare.outputs.build_any == 'true'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.IMAGE_REGISTRY_TOKEN || github.token }}

      - name: Image tag
        id: vars
        run: echo "image_tag=${{ needs.prepare.outputs.head_sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and push backend
        if: needs.prepare.outputs.build_backend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./agent-insight-server/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_BACKEND }}:${{ steps.vars.outputs.image_tag }}
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_BACKEND }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        if: needs.prepare.outputs.build_frontend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./agent-insight-web
          file: ./agent-insight-web/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=/api
          tags: |
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_FRONTEND }}:${{ steps.vars.outputs.image_tag }}
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_FRONTEND }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "## Build" >> "$GITHUB_STEP_SUMMARY"
          echo "- sha: \`${{ steps.vars.outputs.image_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- backend: ${{ needs.prepare.outputs.build_backend }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- frontend: ${{ needs.prepare.outputs.build_frontend }}" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to Server
    needs: [prepare, build]
    if: needs.prepare.outputs.build_any == 'true'
    runs-on: ubuntu-latest
    environment: xcy

    steps:
      - name: Validate SSH key
        run: |
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/ssh_key
          chmod 600 ~/ssh_key
          ssh-keygen -l -f ~/ssh_key

      - name: Deploy via SSH (pull only — no compose/.env copy)
        uses: appleboy/ssh-action@v1.2.5
        env:
          NEW_TAG: ${{ needs.build.outputs.image_tag }}
          MANUAL_TAG: ${{ inputs.image_tag }}
          BUILD_BE: ${{ needs.prepare.outputs.build_backend }}
          BUILD_FE: ${{ needs.prepare.outputs.build_frontend }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DEPLOY_PATH,COMPOSE_FILE,COMPOSE_BACKEND,COMPOSE_FRONTEND,NEW_TAG,MANUAL_TAG,BUILD_BE,BUILD_FE,IMAGE_REGISTRY
          script: |
            set -e
            echo "=== CD 不拷贝 compose/.env；只拉镜像重启（服务器本地维护配置）==="
            cd "${{ env.DEPLOY_PATH }}"

            echo "${{ secrets.IMAGE_REGISTRY_TOKEN || github.token }}" | docker login ${{ env.IMAGE_REGISTRY }} -u ${{ github.actor }} --password-stdin

            if [ -n "$MANUAL_TAG" ]; then
              DEPLOY_TAG="$MANUAL_TAG"
            else
              DEPLOY_TAG="latest"
            fi
            echo "Deploy tag=$DEPLOY_TAG (build=$NEW_TAG)"

            SERVICES=""
            if [ "$BUILD_BE" = "true" ]; then SERVICES="$SERVICES ${{ env.COMPOSE_BACKEND }}"; fi
            if [ "$BUILD_FE" = "true" ]; then SERVICES="$SERVICES ${{ env.COMPOSE_FRONTEND }}"; fi
            SERVICES=$(echo "$SERVICES" | xargs)
            echo "Services: $SERVICES"

            IMAGE_TAG="$DEPLOY_TAG" docker compose -f ${{ env.COMPOSE_FILE }} pull $SERVICES
            IMAGE_TAG="$DEPLOY_TAG" docker compose -f ${{ env.COMPOSE_FILE }} up -d --remove-orphans $SERVICES

            echo "=== Health check (最多 90s) ==="
            for svc in $SERVICES; do
              HEALTHY=false
              for i in $(seq 1 18); do
                sleep 5
                STATUS=$(docker inspect --format='{{.State.Health.Status}}' "$svc" 2>/dev/null || echo "none")
                RUNNING=$(docker inspect --format='{{.State.Running}}' "$svc" 2>/dev/null || echo "false")
                echo "  $svc attempt $i: health=$STATUS running=$RUNNING"
                if [ "$STATUS" = "healthy" ] || [ "$STATUS" = "none" -a "$RUNNING" = "true" ]; then
                  # backend 若无 Health 字段则看 Running；有 Health 必须 healthy
                  if [ "$STATUS" = "healthy" ] || [ "$STATUS" = "none" ]; then
                    HEALTHY=true
                    break
                  fi
                fi
                if [ "$RUNNING" = "false" ]; then
                  break
                fi
              done
              if [ "$HEALTHY" != "true" ]; then
                echo "Health check failed for $svc"
                docker logs "$svc" --tail 80 || true
                exit 1
              fi
            done

            docker compose -f ${{ env.COMPOSE_FILE }} ps
            echo "=== Deploy OK ==="

      - name: Cleanup
        if: always()
        run: rm -f ~/ssh_key
