name: Secret Scan (Gitleaks)

# -----------------------------------------------------------------------------
# 用途：每次 push / PR 都扫描仓库中是否包含 API key、数据库密码、JWT 等
#       敏感凭据（AGENTS.md §6.4 红线）
#
# 触发：
#   - push 到 main / develop 分支
#   - 所有 PR（指向 main / develop）
#   - 手动触发（workflow_dispatch）
#
# 工作原理：
#   - 使用官方 gitleaks-action v2
#   - 自动检测仓库根目录的 .gitleaks.toml（无需 GITLEAKS_CONFIG）
#   - v2 默认全量扫描 git 历史（包括已删除文件）
#   - 失败时阻止 PR 合并（GitHub branch protection 推荐配置）
#
# 文档：https://github.com/gitleaks/gitleaks-action/blob/master/v2.md
# -----------------------------------------------------------------------------

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  # gitleaks-action 需要 security-events 写权限来上传 SARIF 到 Security tab
  security-events: write

jobs:
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (full history)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 自定义规则路径（也可省略，action 会自动检测仓库根 .gitleaks.toml）
          GITLEAKS_CONFIG: .gitleaks.toml
