# =============================================================================
# Traefik 动态配置（HTTP 服务配置）
# =============================================================================
# 位置：/opt/docker/traefik/dynamic/https.yml
# 说明：
#   - 定义各类 HTTP 服务的路由规则
#   - 可按需添加更多服务配置
#
# 配置说明：
#   ┌─────────────────────────────────────────────────────────────────────────┐
#   │                          Traefik 工作原理                                │
#   │                                                                         │
#   │   用户请求                                                                │
#   │      ↓                                                                   │
#   │   Traefik (监听 80/443 端口)                                            │
#   │      ↓                                                                   │
#   │   [router 路由规则] ——— 根据 rule 匹配请求                               │
#   │      ↓                                                                   │
#   │   [service 服务] ——— 转发到实际容器                                     │
#   │      ↓                                                                   │
#   │   实际容器 (portainer:9000)                                              │
#   └─────────────────────────────────────────────────────────────────────────┘
#
#   rule: "Host(`1.2.3.4`)"         ← 路由规则：什么请求进来？
#         ↑                                          ↑
#         │                                          │
#   匹配用户访问的 Host 头                    实际容器名:容器端口
#   即：用户访问 http://1.2.3.4 时           （在 Docker 网络中解析）
#       Traefik 就把请求路由到 portainer
# =============================================================================

http:
  # ---------------------------------------------------------------------------
  # Portainer
  # ---------------------------------------------------------------------------
  # 方式 1：域名访问（需要 DNS 解析）
  #  当用户访问 http://portainer.yourdomain.com 时，匹配此规则
  # routers:
  #   portainer:
  #     rule: "Host(`portainer.yourdomain.com`)"
  #     service: portainer-svc
  #     entrypoints:
  #       - websecure
  #     tls:
  #       certResolver: letsencrypt

  # 方式 2：IP 直接访问（无域名时使用）
  #  当用户访问 http://1.2.3.4 时，匹配此规则
  #  ⚠️ 把 1.2.3.4 改成你的服务器 IP
  # routers:
  #   portainer:
  #     rule: "Host(`1.2.3.4`)"
  #     service: portainer-svc
  #     entrypoints:
  #       - websecure
  #     tls:
  #       certResolver: letsencrypt

  # 方式 3：Docker Labels（推荐用于需要环境变量的场景）
  #  在服务的 docker-compose.yml 中添加 labels，docker-compose 会自动替换 ${DOMAIN} 变量
  #  Traefik 自动发现服务并应用路由规则，无需修改此文件（删掉或者https.yml 里关于 portainer 的全部配置都要注释）
  #
  #  示例（portainer docker-compose.yml 中添加）：
  #   labels:
  #     - "traefik.enable=true"
  #     - "traefik.http.routers.portainer.rule=Host(`${DOMAIN}`)"
  #     - "traefik.http.routers.portainer.entrypoints=websecure"
  #     - "traefik.http.routers.portainer.tls=true"
  #     - "traefik.http.services.portainer.loadbalancer.server.port=9000"
  #
  #  对比：
  #  ┌─────────────┬───────────────┬───────────┬────────────────┐
  #  │ 方式        │ 环境变量支持  │ 热加载    │ 配置位置        │
  #  ├─────────────┼───────────────┼───────────┼────────────────┤
  #  │ 方式 1/2    │ ❌ 不支持     │ ❌ 需reload│ traefik 目录   │
  #  │ 方式 3      │ ✅ 支持       │ ✅ 自动   │ 各服务目录     │
  #  └─────────────┴───────────────┴───────────┴────────────────┘
  # ---------------------------------------------------------------------------
  # 实际生效配置（IP 直接访问）
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # Traefik Dashboard（仅内网访问时使用）
  # ---------------------------------------------------------------------------
  # 方式 1：域名访问
  #  当用户访问 http://traefik.yourdomain.com 时，匹配此规则
  # routers:
  #   traefik-dashboard:
  #     rule: "Host(`traefik.yourdomain.com`)"
  #     service: api@internal
  #     entrypoints:
  #       - websecure
  #     tls:
  #       certResolver: letsencrypt

  # 方式 2：IP 直接访问
  #  当用户访问 http://1.2.3.4:8080 时，匹配此规则
  # routers:
  #   traefik-dashboard:
  #     rule: "Host(`1.2.3.4`)"
  #     service: api@internal
  #     entrypoints:
  #       - websecure
  #     tls:
  #       certResolver: letsencrypt
