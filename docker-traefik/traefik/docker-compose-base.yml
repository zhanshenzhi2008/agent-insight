# =============================================================================
# Traefik 基础服务 docker-compose.yml
# =============================================================================
# 位置：/opt/docker/docker-compose-base.yml
# 说明：
#   - 包含 Traefik（反向代理）和 Portainer（容器管理）
#   - 这是全局基础设施，只需启动一次
#
# 目录结构（部署后）：
#   /opt/docker/
#   ├── docker-compose-base.yml      ← 本文件
#   ├── traefik/
#   │   ├── traefik.yml
#   │   ├── acme.json
#   │   ├── logs/
#   │   └── dynamic/
#   └── portainer/
#       └── data/
#
# 使用方法：
#   1. 将本文件复制到 /opt/docker/docker-compose-base.yml
#   2. 将 traefik/traefik.yml 复制到 /opt/docker/traefik/traefik.yml
#   3. 将 traefik/dynamic/https.yml 复制到 /opt/docker/traefik/dynamic/https.yml
#   4. mkdir -p /opt/docker/traefik && chmod 600 /opt/docker/traefik/acme.json
#   5. cd /opt/docker && docker compose -f docker-compose-base.yml up -d
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Traefik 反向代理 + 自动 HTTPS
  # ---------------------------------------------------------------------------
  traefik:
    # v3.6.1+ 才兼容 Docker Engine 29（API min 1.44）
    # 旧版会报：client version 1.24 is too old
    image: traefik:v3.6.1
    container_name: traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"   # Dashboard（仅内网访问）
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./traefik/acme.json:/acme.json
      - ./traefik/logs:/var/log/traefik
    environment:
      - TZ=Asia/Shanghai
    networks:
      - proxy

  # ---------------------------------------------------------------------------
  # Portainer 可视化管理（可选）
  # ---------------------------------------------------------------------------
  # 路由方式说明：
  #   - 方式 A（推荐）：通过 Docker Labels 自动发现路由（下方 labels 配置）
  #     - 无需在 https.yml 里手动写 portainer 的 router/service
  #     - Traefik 自动读取容器 labels，文件变化自动 reload（traefik.yml 中 watch: true）
  #   - 方式 B（手动）：在 https.yml 的 file provider 里写死 router/service
  #     - 需要两处同时维护，容易不一致
  #     - 适合：某些服务不支持加 labels 时
  # ---------------------------------------------------------------------------
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    ports:
      - "127.0.0.1:9443:9443"    # HTTPS 管理界面
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./portainer/data:/data
    environment:
      - TZ=Asia/Shanghai
    # 【方式 A】Docker Labels 自动发现（由 traefik.yml 的 providers.docker 读取）
    # 域名来自 /opt/docker/.env 的 BASE_DOMAIN（例如 sqrt3lab.duckdns.org）
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portainer.rule=Host(`portainer.${BASE_DOMAIN}`)"
      - "traefik.http.routers.portainer.entrypoints=websecure"
      - "traefik.http.routers.portainer.tls.certresolver=letsencrypt"
      - "traefik.http.services.portainer.loadbalancer.server.port=9000"
    networks:
      - proxy
    # 注：portainer 的 router/service 已通过 Docker Labels + ${BASE_DOMAIN} 自动发现

networks:
  proxy:
    name: proxy
    driver: bridge