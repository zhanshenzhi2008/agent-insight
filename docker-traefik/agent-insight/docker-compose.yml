# =============================================================================
# Agent Insight — Traefik 部署版 docker-compose.yml（方案 A，推荐）
# =============================================================================
# 方案 A 的流量路径：
#   浏览器 → Traefik:443 → agent-insight-frontend:80
#                         └→ Nginx /api/* → agent-insight-backend:9280
#
# 前置条件：
#   - Traefik 已运行并加入 external 网络 proxy；其 web entrypoint 会跳转 HTTPS。
#   - MySQL / MongoDB / Redis 已运行并加入 external 网络 db-net。
#   - 本项目部署目录为 /opt/project/agent-insight/。
#
# 配置来源：
#   - 复制 .env.example 为同级 .env；该文件既供 Compose 插值，也注入后端容器。
#   - 在 Portainer 部署时，将同名变量填写在 Stack environment variables。
#   - .env 含凭据，严禁提交；仅提交 .env.example 模板。
#
# 部署步骤：
#   1. cd /opt/databases && docker compose up -d
#   2. cd /opt/docker && docker compose -f docker-compose-base.yml up -d
#   3. cd /opt/project/agent-insight
#        cp .env.example .env && vi .env   # 填 DOMAIN / MYSQL_PASSWORD 等
#        sudo mkdir -p data && sudo chown -R 1000:1000 data
#   4. docker compose up -d
#
# 访问：
#   https://${DOMAIN}/          → 前端
#   https://${DOMAIN}/api/      → API（Nginx 内部代理）
#   https://${DOMAIN}/doc.html  → Swagger
# =============================================================================

services:
  agent-insight-backend:
    # 源码构建仅本地调试用；生产用 GHCR 镜像。
    #build:
    #  context: ../../agent-insight-server
    #  dockerfile: Dockerfile
    image: ghcr.io/${IMAGE_NAMESPACE:-zhanshenzhi2008}/agent-insight/backend:latest
    container_name: agent-insight-backend
    restart: unless-stopped
    expose:
      - "9280"
    # 仅供内部访问：没有 Traefik labels，也不加入 proxy。
    # 前端通过 db-net 中的服务名 agent-insight-backend:9280 访问它。
    # 需要直接公开 API 时，使用 docker-compose.b-traefik-api.yml 或方案 C。
    #
    # 后端是 Spring Boot：健康检查用官方 Actuator，不是 Nginx 的 /health。
    # Dockerfile HEALTHCHECK：curl -f http://localhost:9280/actuator/health
    # （需 spring-boot-starter-actuator；默认路径 /actuator/health，不是 /health）
    env_file:
      - .env
    environment:
      JAVA_OPTS: "-Xms512m -Xmx1024m -XX:+UseG1GC"
      # 这是应用进程环境变量；Traefik labels 中的 ${DOMAIN} 在 Compose 解析时
      # 已从同级 .env 或 Portainer Stack environment variables 取值。
      #DOMAIN: "${DOMAIN:-}"
      INSIGHT_LOG_ROOT: /app/project/data
      INSIGHT_SCRIPT_ROOT: /app/project/data/system/agt
    volumes:
      - ${DATA_ROOT:-/opt/project/agent-insight/data}:/app/project/data
    networks:
      - db-net
      # 方案 A 不加入 proxy

  agent-insight-frontend:
    #build:
    #  context: ../../agent-insight-web
    #  dockerfile: ../../agent-insight-web/Dockerfile
    #  args:
    #    VITE_API_BASE_URL: /api
    image: ghcr.io/${IMAGE_NAMESPACE:-zhanshenzhi2008}/agent-insight/frontend:latest
    container_name: agent-insight-frontend
    restart: unless-stopped
    expose:
      - "80"
    # 唯一的公网入口。DOMAIN 必须是完整域名，例如 insight.example.com；
    # 变量缺失时 Compose 会拒绝部署，避免生成 Host(``) 的无效路由。
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.agent-insight-frontend.rule=Host(`${DOMAIN:?Set DOMAIN in .env}`)"
      - "traefik.http.routers.agent-insight-frontend.entrypoints=websecure"
      - "traefik.http.routers.agent-insight-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.agent-insight-frontend.priority=10"
      - "traefik.http.services.agent-insight-frontend.loadbalancer.server.port=80"
      - "traefik.docker.network=proxy"
    # 覆盖镜像 HEALTHCHECK：BusyBox wget 仅支持 -q/--spider 子集
    # Traefik v3 会过滤 unhealthy/starting 容器导致域名 404
    #
    # 注意：这是【前端 Nginx】容器的健康检查，不是 Java 后端！
    # - Spring Boot（本项目后端）原生健康检查是 Actuator：/actuator/health（端口 9280）
    # - 本行探测的是本容器 Nginx 的 location = /health（端口 80，nginx.conf 内 return 200）
    # - 切勿写成 actuator 或 9280：frontend 容器里没有 Spring，检查必失败 → Traefik 404
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - agent-insight-backend
    networks:
      - db-net
      - proxy

networks:
  # 项目内部网络：前端经此网络访问后端，后端经此网络访问数据库。
  db-net:
    name: db-net
    external: true
  # Traefik 代理网络：方案 A 中只有前端加入，后端不会被 Traefik 发现。
  proxy:
    name: proxy
    external: true
