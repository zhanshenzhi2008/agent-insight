# =============================================================================
# Agent Insight — 数据库集合 docker-compose.yml
# =============================================================================
# 用途：
#   - 统一管理 MySQL / MongoDB / Redis，独立于应用部署
#   - 部署位置：/opt/databases/
#   - 多个项目可共享使用此数据库集合
#
# 使用方法：
#   cd /opt/databases
#   cp databases.env.example .env
#   # 编辑 .env，填入 MYSQL_ROOT_PASSWORD 等必填值
#   docker compose --env-file .env up -d
#
# 网络设计：
#   - 创建 external 网络 db-net，供应用连接
#   - 数据库服务仅加入此网络，不对外暴露端口
#   - 应用项目通过 external 网络引用连接
#
# 数据持久化：
#   - mysql    → /opt/databases/mysql/data
#   - mongodb  → /opt/databases/mongodb/data
#   - redis    → /opt/databases/redis/data
#   - pgsql   → /opt/databases/pgsql/data  ← agent-insight 暂不使用，供云端其他项目共用
#
# 安全说明：
#   - 所有变量必须在 .env 中显式提供，不设置默认值（避免明文/默认凭据泄露）
#   - 业务库（insight）与业务用户（insight_app）由人工在容器启动后创建，
#     不通过环境变量自动初始化（生产环境强制 DBA 介入）
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # MySQL 服务
  #   - agent-insight 自身元数据存储（insight_datasource / insight_table_config）
  #   - 注意：log_llm_* 日志表已迁移到 MongoDB（见 docs/00-revision-2026-07-03.md）
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.4
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - ./mysql/data:/var/lib/mysql
      # 初始化脚本（首次启动时执行，仅当 ./mysql/data 为空时）
      #- ./mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - db-net

  # ---------------------------------------------------------------------------
  # MongoDB 服务（元数据存储 + llm-agent 业务数据查询）
  #   - insight_* 元数据集合（datasource / table_config / column_config 等）
  #   - W2+ 通过 MongoQueryEngine 动态查询外部 llm-agent Mongo
  # ---------------------------------------------------------------------------
  mongodb:
    image: mongo:8.3
    container_name: mongodb
    restart: unless-stopped
    #environment:
    #  MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-}
    #  MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-}
    ports:
      - "27017:27017"
    volumes:
      - ./mongodb/data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - db-net

  # ---------------------------------------------------------------------------
  # Redis 服务（查询结果缓存）
  # ---------------------------------------------------------------------------
  redis:
    image: redis:8.8.0-alpine
    container_name: redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - ./redis/data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - db-net

  # ---------------------------------------------------------------------------
  # PostgreSQL 服务（含 pgvector 向量扩展）
  #   - 基础镜像：pgvector/pgvector（pgvector 官方维护的 PostgreSQL + pgvector 一体化镜像）
  #     注意：该镜像 PG 18 系列没有 alpine tag，三种 tag 共用同一层（默认 trixie）；
  #     选择 bookworm 是因为它对应 Debian 12 stable（LTS），比 testing 稳。
  #   - pgvector 版本：0.8.6；PostgreSQL 版本：18；base：Debian 12 bookworm
  #   - 启用 pgvector：在目标库执行 `CREATE EXTENSION IF NOT EXISTS vector;`
  #   - agent-insight 当前未使用此数据库
  #   - 在本服务器上为其他云端项目共用（避免每个项目单独跑一个 pgsql 容器）
  #   - 凭据通过 .env 的 POSTGRES_PASSWORD 提供，业务库/业务用户由人工创建
  # ---------------------------------------------------------------------------
  pgsql:
    image: pgvector/pgvector:0.8.6-pg18-bookworm
    container_name: pgsql
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      TZ: Asia/Shanghai
      # 认证方式：scram-sha-256（PG 14+ 默认，安全；兼容 Spring Boot JDBC）
      # 如遇老客户端认证失败，可临时改为 md5（不推荐长期使用）
      POSTGRES_HOST_AUTH_METHOD: ${POSTGRES_HOST_AUTH_METHOD:-scram-sha-256}
    ports:
      - "5432:5432"
    volumes:
      - ./pgsql/data:/var/lib/postgresql
      # PG 18+ 要求挂载到 /var/lib/postgresql（旧版本是 /var/lib/postgresql/data）
      # 数据实际存储在子目录 /var/lib/postgresql/18/main
      # 初始化脚本（首次启动时执行，仅当 ./pgsql/data 为空时）
      # 例：在指定库里建 pgvector 扩展：
      #   CREATE EXTENSION IF NOT EXISTS vector;
      # - ./pgsql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - db-net

# -----------------------------------------------------------------------------
# 网络
# -----------------------------------------------------------------------------
# 创建 external 网络供应用项目连接
# 应用项目通过 external 方式引用此网络名
networks:
  db-net:
    external: true
    name: db-net